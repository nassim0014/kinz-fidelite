services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kinz
      POSTGRES_PASSWORD: kinz
      POSTGRES_DB: kinz_dev
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kinz']
      interval: 2s
      retries: 20
volumes:
  pgdata:
